<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Perform Properties</title>
<style>
  :root {
    --charcoal: #1C1C1E;
    --charcoal-soft: #2A2A2D;
    --gold: #B08D3C;
    --brand-red: #ED1C25;
    --cream: #F6F4EF;
    --rule: #E1DCD1;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(180deg, var(--cream) 0%, #EDE8DC 100%);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    color: var(--charcoal);
    padding: 32px 20px;
  }

  .card {
    width: 100%;
    max-width: 420px;
    background: #FFFFFF;
    border: 1px solid var(--rule);
    border-radius: 4px;
    padding: 44px 36px 40px;
    text-align: center;
    box-shadow: 0 1px 2px rgba(28, 28, 30, 0.05);
  }

  .mark {
    width: 68px;
    height: 68px;
    margin: 0 auto 24px;
    border-radius: 16px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .mark img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .rule {
    width: 40px;
    height: 3px;
    background: var(--brand-red);
    margin: 0 auto 20px;
    border-radius: 2px;
  }

  h1 {
    font-size: 24px;
    letter-spacing: 0.01em;
    margin: 0 0 10px;
    font-weight: 700;
    color: var(--charcoal);
  }

  p.sub {
    margin: 0 0 32px;
    font-size: 15px;
    line-height: 1.5;
    color: #6B6B6F;
  }

  .stores {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .store-link {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 13px 18px;
    border-radius: 8px;
    background: var(--charcoal);
    color: #fff;
    text-decoration: none;
    transition: background 0.15s ease, transform 0.1s ease;
    text-align: left;
  }

  .store-link:hover {
    background: var(--charcoal-soft);
  }

  .store-link:active {
    transform: scale(0.99);
  }

  .store-link svg {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    color: #FFFFFF;
  }

  .store-text {
    display: flex;
    flex-direction: column;
    line-height: 1.15;
  }

  .store-text .eyebrow {
    font-size: 10.5px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    opacity: 0.75;
  }

  .store-text .name {
    font-size: 16.5px;
    font-weight: 600;
  }

  footer {
    margin-top: 32px;
    font-size: 12.5px;
    color: #A0A0A4;
  }

  @media (max-width: 480px) {
    .card { padding: 36px 24px 32px; }
  }
</style>
</head>
